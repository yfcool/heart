<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>D&X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fdfbfc 0%, #f9f3f5 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 漂浮小爱心 — 浪漫背景，保留 */
        body::before, body::after {
            content: "❤️";
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.15;
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            top: 8%;
            left: 5%;
            transform: rotate(-10deg);
            animation-duration: 12s;
        }
        body::after {
            bottom: 10%;
            right: 6%;
            font-size: 3rem;
            opacity: 0.12;
            animation: float 10s infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* 额外多个小图标（只用❤️和✨，更简洁） */
        .deco {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        .deco span {
            position: absolute;
            color: rgba(253, 164, 191, 0.2);
            font-size: 1.8rem;
            user-select: none;
            animation: twinkle 5s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.9); }
            100% { opacity: 0.4; transform: scale(1.2); }
        }

        /* 主卡片 — 半透磨砂玻璃 */
        .card {
            background: rgba(255, 245, 250, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
            box-shadow: 0 25px 45px rgba(230, 120, 150, 0.25),
                        0 10px 20px rgba(255, 200, 220, 0.4),
                        inset 0 1px 4px rgba(255, 255, 255, 0.8);
            padding: 2.8rem 2.5rem;
            max-width: 750px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            z-index: 2;
            position: relative;
        }

        /* 起始时间 — 极简一行，小图标点缀 */
        .start-line {
            font-size: 1.3rem;
            color: #a84a6e;
            background: rgba(255, 230, 240, 0.2);
            display: inline-block;
            padding: 0.4rem 1.8rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            border: 1px solid #ffc0d5;
            backdrop-filter: blur(4px);
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .start-line i {
            font-style: normal;
            margin: 0 6px;
        }

        /* 天数大数字 */
        .days-display {
            font-size: 6rem;
            font-weight: 400;
            line-height: 1.1;
            color: #601f3b;
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 1rem;
        }

        #days {
            font-weight: 600;
            font-size: 7rem;
            background: linear-gradient(135deg, #db5082, #a13562);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 10px 20px rgba(200, 70, 120, 0.25);
            letter-spacing: 2px;
        }

        .days-unit {
            font-size: 3rem;
            font-weight: 300;
            color: #8d4a66;
            margin-left: 0.2rem;
            margin-right: 0.5rem;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
        }

        /* 时分秒卡片 */
        .time-display {
            margin: 1.2rem auto 0;
            font-size: 3.2rem;
            font-weight: 350;
            color: #822f53;
            background: rgba(255, 215, 230, 0.4);
            padding: 0.6rem 2rem;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 220, 0.6);
            box-shadow: 0 5px 12px rgba(190, 100, 130, 0.2);
        }

        .time-display span {
            font-weight: 500;
            font-family: 'Quicksand', monospace;
            min-width: 2.6rem;
            display: inline-block;
        }

        .time-dispan-suffix {
            min-width: 1.6rem !important;
            font-size: 1.5rem;
            margin: 0 0.2rem;
            color: #b15d7f;
        }

        /* 装饰小星星 (保留一些) */
        .deco span:nth-child(1) { top: 12%; left: 88%; animation-delay: 0s; }
        .deco span:nth-child(2) { top: 75%; left: 10%; animation-delay: 1s; font-size: 2.2rem; }
        .deco span:nth-child(3) { top: 40%; left: 20%; animation-delay: 2.3s; }
        .deco span:nth-child(4) { top: 85%; left: 85%; animation-delay: 0.7s; content: "✨"; }
        .deco span:nth-child(5) { top: 20%; left: 15%; animation-delay: 1.8s; font-size: 2.5rem; }
        .deco span:nth-child(6) { top: 60%; left: 92%; animation-delay: 2.9s; }

        /* 手机适配 */
        @media (max-width: 550px) {
            .days-display { font-size: 4rem; }
            #days { font-size: 5rem; }
            .days-unit { font-size: 2.4rem; }
            .time-display { font-size: 2.4rem; padding: 0.5rem 1rem; }
            .start-line { font-size: 1.1rem; }
            .footer-icons { font-size: 1.3rem; }
            .card { padding: 2rem 1.2rem; }
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- 极简起始时间：只有日期和一颗小心 -->
        <div class="start-line">
            </span> 2022.05.29 <span>
        </div>

        <!-- 天数区域：大数字 + “天” + 跳动爱心（小图标） -->
        <div class="days-display">
            <span id="days">0</span>
            <span class="days-unit">天</span>
        </div>

        <!-- 时分秒显示，保留汉字单位，简洁 -->
        <div class="time-display">
            <span id="hours">00</span><span class="time-dispan-suffix">时</span>
            <span id="minutes">00</span><span class="time-dispan-suffix">分</span>
            <span id="seconds">00</span><span class="time-dispan-suffix">秒</span>
        </div>
        
    </main>

    <script>
        (function() {
            // 起始时间：北京时间 2022-05-29 23:00 (UTC+8) => UTC 2022-05-29 15:00
            const startTimestamp = Date.UTC(2022, 4, 29, 15, 0, 0);  // 月份 4 = 五月

            const daysSpan = document.getElementById('days');
            const hoursSpan = document.getElementById('hours');
            const minutesSpan = document.getElementById('minutes');
            const secondsSpan = document.getElementById('seconds');

            function padTwo(num) {
                return num < 10 ? '0' + num : num;
            }

            function updateTimer() {
                const now = Date.now();
                const diffMs = now - startTimestamp;

                if (diffMs < 0) {
                    daysSpan.textContent = '0';
                    hoursSpan.textContent = '00';
                    minutesSpan.textContent = '00';
                    secondsSpan.textContent = '00';
                    return;
                }

                const totalSeconds = Math.floor(diffMs / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const remainingSeconds = totalSeconds % 86400;

                const hours = Math.floor(remainingSeconds / 3600);
                const minutes = Math.floor((remainingSeconds % 3600) / 60);
                const seconds = remainingSeconds % 60;

                daysSpan.textContent = days.toLocaleString();   // 例如 "1,234"
                hoursSpan.textContent = padTwo(hours);
                minutesSpan.textContent = padTwo(minutes);
                secondsSpan.textContent = padTwo(seconds);
            }

            updateTimer();
            const intervalId = setInterval(updateTimer, 1000);

            window.addEventListener('beforeunload', function() {
                clearInterval(intervalId);
            });
        })();
    </script>

    <!-- 没有任何多余文字，只有右下角一颗极小的隐藏爱心 (可选) 但为了极简，不加任何文字 -->
</body>
</html>
